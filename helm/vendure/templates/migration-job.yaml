apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migration-{{ .Release.Revision }}
  labels:
    app: vendure-migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded

spec:
  backoffLimit: 3

  template:
    metadata:
      labels:
        app: vendure-migration

    spec:
      restartPolicy: Never

      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      containers:
        - name: migration
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          command: ["node", "dist/migrate.js"]

          env:
            - name: APP_ENV
              value: {{ .Values.env.appEnv | quote }}

            - name: DB_HOST
              value: {{ .Values.env.db.host | quote }}

            - name: DB_PORT
              value: {{ .Values.env.db.port | quote }}

            - name: DB_NAME
              value: {{ .Values.env.db.name | quote }}

            - name: DB_SCHEMA
              value: {{ .Values.env.db.schema | quote }}

            - name: REDIS_HOST
              value: {{ .Values.env.redis.host | quote }}

            - name: REDIS_PORT
              value: {{ .Values.env.redis.port | quote }}

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: DB_PASSWORD

            - name: SUPERADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: SUPERADMIN_USERNAME

            - name: SUPERADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: SUPERADMIN_PASSWORD

            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: COOKIE_SECRET

          resources:
            {{- toYaml .Values.resources | nindent 12 }}