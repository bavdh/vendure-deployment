# INFORMATION
# We are not exposing the default ports for the services in this file.
# This is to avoid conflicts with existing services on your machine.
# In case you don't have any services running on the default ports, you can expose them by changing the
# ports section in the services block. Please don't forget to update the ports in the .env file as well.

# The explicit project name keeps this project's containers and volumes distinct from
# those of other projects, even when this file lives in an identically-named directory
# (e.g. apps/server in a monorepo). Quoted so that numeric-looking names (e.g. "123")
# stay YAML strings — Compose rejects a non-string name.
name: "vendure-assignment"

services:
  postgres_db:
    image: postgres:18-alpine
    volumes:
      - postgres_db_data:/var/lib/postgresql
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      - "io.vendure.create.name=vendure-assignment"

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      - "io.vendure.create.name=vendure-assignment"

  vendure:
    build:
      context: .
      target: development
    environment:
      APP_ENV: dev

      DB_NAME: ${DB_NAME}
      DB_SCHEMA: ${DB_SCHEMA}
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      COOKIE_SECRET: ${COOKIE_SECRET}
    ports:
      - "${VENDURE_SERVER_PORT}:3000"
      - "${VENDURE_DASHBOARD_PORT}:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_db_data:
    driver: local
    labels:
      - "io.vendure.create.name=vendure-assignment"
  redis_data:
    driver: local
    labels:
      - "io.vendure.create.name=vendure-assignment"
  node_modules:
    driver: local
